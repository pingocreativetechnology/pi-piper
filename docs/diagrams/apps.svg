<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" role="img" aria-labelledby="title desc">
  <title id="title">Starter apps on the Pi Piper launcher</title>
  <desc id="desc">The launcher opens Steps, Clips, or MIDI. Shift and Stop return to the launcher. A Python file can add another app.</desc>
  <rect width="880" height="250" rx="16" fill="#f6f1e7"/>
  <text x="28" y="36" fill="#241b10" font-family="Georgia, serif" font-size="20">Starter apps</text>
  <rect x="330" y="58" width="220" height="52" rx="12" fill="#241b10"/>
  <text x="440" y="90" text-anchor="middle" fill="#e0b15c" font-family="Georgia, serif" font-size="18">Launcher</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="13" fill="#f6f1e7">
    <rect x="36" y="150" width="180" height="72" rx="12" fill="#8a6428"/>
    <text x="126" y="178" text-anchor="middle" font-size="16">Steps</text>
    <text x="126" y="200" text-anchor="middle">16-step drums</text>
    <rect x="246" y="150" width="180" height="72" rx="12" fill="#1e4a3c"/>
    <text x="336" y="178" text-anchor="middle" font-size="16">Clips</text>
    <text x="336" y="200" text-anchor="middle">4×4 scenes</text>
    <rect x="456" y="150" width="180" height="72" rx="12" fill="#3d6fbf"/>
    <text x="546" y="178" text-anchor="middle" font-size="16">MIDI</text>
    <text x="546" y="200" text-anchor="middle">notes for synths</text>
    <rect x="666" y="150" width="180" height="72" rx="12" fill="#ffffff" stroke="#d7c7a4"/>
    <text x="756" y="178" text-anchor="middle" fill="#241b10" font-size="16">Your file</text>
    <text x="756" y="200" text-anchor="middle" fill="#3a3126">subclass App</text>
  </g>
  <g stroke="#a8782a" stroke-width="2" fill="none">
    <path d="M440 110 V132 H126 V150"/>
    <path d="M440 132 H336 V150"/>
    <path d="M440 132 H546 V150"/>
    <path d="M440 132 H756 V150"/>
  </g>
  <g fill="#a8782a">
    <polygon points="126,150 120,140 132,140"/>
    <polygon points="336,150 330,140 342,140"/>
    <polygon points="546,150 540,140 552,140"/>
    <polygon points="756,150 750,140 762,140"/>
  </g>
</svg>
